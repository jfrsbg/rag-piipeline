[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-embeddings"
version = "0.1.0"
description = "Parse documents once, cache, fan out to relational tables and vector chunks."
requires-python = ">=3.10"
dependencies = [
    "docling>=2.118.1,<3",
    "docling-core[chunking]>=2.91.0,<3",
    "sentence-transformers>=5.7.0,<6",
    "psycopg[binary]>=3.3.4,<4",
    "pgvector>=0.5.0,<1",
]

[project.scripts]
rag-parse = "rag_embeddings.steps.parse:main"
rag-index = "rag_embeddings.steps.index:main"

[tool.setuptools.packages.find]
include = ["rag_embeddings*"]
