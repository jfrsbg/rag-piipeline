# One way to run the pipeline: everything is a service, and work arrives on a
# queue.
#
#   docker compose up -d                       # db, both services, the api
#   docker compose run --rm enqueue files /data/inbox
#
# That is the whole loop. `up` brings the services online and they stay online,
# blocking on an empty queue; `enqueue` is a one-shot producer that publishes
# one message per document and exits. Nothing is "run to completion" any more —
# a drained queue is an idle service, not a finished job, which is the only
# shape that survives being moved to k8s or ECS unchanged.
#
# `enqueue` is behind a profile so that `up` does not start it: it is a job, not
# a service, and it is the one thing here that is meant to exit. `compose run`
# ignores profiles, which is why the command above still works.
#
# Scaling is `--scale parse-worker=4`. Nothing coordinates the replicas; the
# rename in the queue directory does.
#
#   docker compose logs -f parse-worker        # watch the backlog drain
#   docker compose run --rm enqueue cached     # re-index what is already parsed
#   docker compose run --rm enqueue stale      # rechunk after a profile change
#
# To drain and stop rather than stay up — a backfill, or CI — give the services
# an idle timeout, which is the only thing that makes them exit on their own:
#
#   RAG_IDLE_TIMEOUT=5 docker compose up parse-worker index-worker
#
# The read side is a service for the same reason: it stays up, holds the model
# resident and answers HTTP rather than paying a model load per query.
#
#   curl -s localhost:8000/search -H 'content-type: application/json' \
#        -d '{"query": "what were the Q3 logistics costs?"}'

x-app: &app
  build:
    context: .
  # Anchored separately so a service can add one variable to this set instead
  # of restating it — merging into a mapping replaces the whole key.
  environment: &app-env
    RAG_CACHE_DIR: /cache/parsed
    RAG_PARSER_VERSION: ${RAG_PARSER_VERSION:-docling-2.118}
    RAG_EMBED_PROFILE: ${RAG_EMBED_PROFILE:-bge-m3}
    # Tokens per forward pass, padding included — the knob that bounds the
    # embedder's peak memory. Lower it before raising mem_limit below.
    RAG_EMBED_TOKEN_BUDGET: ${RAG_EMBED_TOKEN_BUDGET:-16384}
    RAG_DSN: postgresql://postgres:postgres@db:5432/docs
    # The queue is a directory on a shared volume. Swapping the backend is this
    # one variable — see rag_embeddings/queues/__init__.py.
    RAG_QUEUE_URL: ${RAG_QUEUE_URL:-file:///queue}
    # Empty — the normal case — means a service blocks on an empty queue
    # forever, which is what `up` and a Deployment both want. Set it to a
    # number of seconds to drain and stop instead: each service exits once its
    # queue has been quiet that long, so `compose up` terminates. That is for a
    # backfill or CI, not for running the pipeline. Ignored by the api.
    RAG_IDLE_TIMEOUT: ${RAG_IDLE_TIMEOUT:-}
    HF_HOME: /models
    # torch takes every core it can see. Packing several workers onto one host
    # without this gives you N processes fighting over the same cores and less
    # throughput than running one. Set it to each container's CPU allocation.
    OMP_NUM_THREADS: ${OMP_NUM_THREADS:-2}
  volumes:
    - ./cache:/cache
    - ./inbox:/data/inbox:ro
    - queue:/queue
    - hf-models:/models

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on an empty data directory only.
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docs"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------------ read

  # The read side, served rather than run. Same profile as `index` by
  # construction — both take it from RAG_EMBED_PROFILE above, which is the
  # mismatch this service exists to avoid: a query embedded through a different
  # model ranks badly, silently.
  #
  #   docker compose up -d api
  #   curl -s localhost:8000/search -H 'content-type: application/json' \
  #        -d '{"query": "what were the Q3 logistics costs?", "limit": 10}'
  #
  # Interactive docs at localhost:8000/docs.
  api:
    <<: *app
    # Its own image: the serving stack, without the step scripts. Everything
    # else — profile, DSN, thread count — still comes from the anchor above,
    # which is what keeps it indexing-compatible with `index`.
    build:
      context: .
      dockerfile: Dockerfile.api
    # No inbox, no queue, no parse cache: this container reads the database and
    # the model volume, and that is the whole of its access.
    volumes:
      - hf-models:/models
    ports:
      - "${RAG_API_PORT:-8000}:8000"
    # Concurrent requests borrow from a pool of this size. Raising it past the
    # cores OMP_NUM_THREADS grants only queues the forward passes differently.
    environment:
      <<: *app-env
      RAG_API_POOL_SIZE: ${RAG_API_POOL_SIZE:-4}
      # The startup profile check logs at WARNING; DEBUG adds the query path.
      RAG_LOG_LEVEL: ${RAG_LOG_LEVEL:-INFO}
    # As with index-worker, and for the same reason: ~2.3 GB of this is the
    # resident fp32 model, and an unbounded container takes the Docker VM and
    # the database with it instead of failing alone.
    mem_limit: ${API_MEM:-4g}
    # A service is meant to stay up. Bounded, so that three crashes on startup
    # surface as a stopped container rather than a restart loop hiding a bad
    # DSN — the pool refuses to open if the database is unreachable.
    restart: on-failure:3
    depends_on:
      db:
        condition: service_healthy

  # ----------------------------------------------------------------- write

  # The producer, and the only thing here that is a job rather than a service.
  # Also `enqueue cached` to re-index what is already parsed and `enqueue stale`
  # to rechunk after a profile change — both whole-cache scans, which is why
  # they live here and not in a service that has N replicas.
  #
  # The profile keeps `up` from running it. `compose run --rm enqueue ...`
  # ignores profiles and is how it is meant to be invoked; anything after the
  # service name is appended to the command below, so `run --rm enqueue cached
  # --chunks-only` works as written.
  enqueue:
    <<: *app
    entrypoint: ["python", "-m", "rag_embeddings.workers.enqueue"]
    command: ["files", "/data/inbox"]
    profiles: ["job"]

  # Step 1's pool. CPU-bound, no database, no model — scale this one freely.
  #   docker compose up -d --scale parse-worker=4 parse-worker
  parse-worker:
    <<: *app
    entrypoint: ["python", "-m", "rag_embeddings.workers.parse_worker"]
    command: []
    # A service that outlives its backlog has to outlive a crash too. Only on
    # failure, and bounded: a clean exit now means it was signalled (or given an
    # idle timeout) and must not be undone, and a container that dies three
    # times on startup is a bad mount, which a restart loop would hide rather
    # than fix.
    restart: on-failure:3
    # Docling on a large PDF takes longer than the 10s default, and SIGKILL
    # mid-parse abandons a claimed message until the visibility timeout expires.
    # SIGTERM is handled: the loop finishes the document in flight, acks it and
    # exits, so this only has to be longer than one document.
    stop_grace_period: 120s
    deploy:
      replicas: ${PARSE_WORKERS:-2}

  # Step 2's pool. Holds a resident embedding model and a database connection,
  # so it is deliberately smaller than the parse pool: past a handful of
  # replicas the HNSW index on chunks.embedding, not the CPU, is the limit.
  index-worker:
    <<: *app
    entrypoint: ["python", "-m", "rag_embeddings.workers.index_worker"]
    command: []
    # As above. The failure this mostly catches is the OOM kill that mem_limit
    # below turns into one dead container, and restarting is only affordable
    # because the model is already on the hf-models volume.
    restart: on-failure:3
    # As above, and for the same reason — one document's embed plus its commit,
    # not a model load: the model is already resident by the time a stop can
    # arrive.
    stop_grace_period: 120s
    # ~2.3 GB of that is the resident fp32 model; the rest is one forward pass,
    # which RAG_EMBED_TOKEN_BUDGET bounds. Unlimited is the wrong default here:
    # an oversized batch then takes the whole Docker VM, and the database with
    # it, instead of failing as one container. This is the cgroup equivalent of
    # the k8s memory limit these workers would carry in a cluster.
    mem_limit: ${INDEX_WORKER_MEM:-4g}
    deploy:
      replicas: ${INDEX_WORKERS:-1}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  hf-models:
  # Shared by every worker. On a cluster this is the broker, and the cache
  # volume beside it is object storage.
  queue:
